<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ATIG — Автономный ИИ-агент</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; background: #1e293b; padding: 20px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        h1 { font-size: 24px; color: #38bdf8; margin-top: 0; }
        .chat-box { height: 350px; overflow-y: auto; background: #0f172a; padding: 15px; border-radius: 8px; border: 1px solid #334155; margin-bottom: 15px; }
        .message { margin-bottom: 12px; padding: 10px 14px; border-radius: 8px; max-width: 80%; line-height: 1.4; }
        .user-msg { background: #0284c7; margin-left: auto; color: #fff; }
        .agent-msg { background: #334155; margin-right: auto; color: #f1f5f9; }
        .input-group { display: flex; gap: 10px; }
        input[type="text"] { flex: 1; padding: 12px; border-radius: 6px; border: 1px solid #475569; background: #0f172a; color: #fff; outline: none; }
        button { padding: 12px 24px; background: #38bdf8; color: #0f172a; font-weight: bold; border: none; border-radius: 6px; cursor: pointer; }
        button:hover { background: #7dd3fc; }
    </style>
</head>
<body>

<div class="container">
    <h1>ATIG — Autonomous Agent</h1>
    <div class="chat-box" id="chatBox">
        <div class="message agent-msg">Здравствуйте! Я автономный агент ATIG. Чем могу помочь?</div>
    </div>
    <div class="input-group">
        <input type="text" id="userInput" placeholder="Напишите задачу (например: Создай задачу проверить систему)..." onkeydown="if(event.key==='Enter') sendMessage()">
        <button onclick="sendMessage()">Отправить</button>
    </div>
</div>

<script>
async function sendMessage() {
    const input = document.getElementById('userInput');
    const chatBox = document.getElementById('chatBox');
    const text = input.value.trim();
    
    if (!text) return;

    chatBox.innerHTML += `<div class="message user-msg">${text}</div>`;
    input.value = '';
    chatBox.scrollTop = chatBox.scrollHeight;

    const loadingId = 'loading-' + Date.now();
    chatBox.innerHTML += `<div class="message agent-msg" id="${loadingId}"><i>ATIG думает...</i></div>`;
    chatBox.scrollTop = chatBox.scrollHeight;

    try {
        const response = await fetch('https://eating-next-brewery.ngrok-free.dev/api/v1/agent/run', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ user_prompt: text })
        });
        
        const data = await response.json();
        document.getElementById(loadingId).remove();

        const agentText = data.agent_response || JSON.stringify(data);
        chatBox.innerHTML += `<div class="message agent-msg"><b>ATIG:</b> ${agentText}</div>`;
    } catch (err) {
        document.getElementById(loadingId).remove();
        chatBox.innerHTML += `<div class="message agent-msg" style="color: #ef4444;">Ошибка связи с агентом. Проверьте запуск Uvicorn.</div>`;
    }
    chatBox.scrollTop = chatBox.scrollHeight;
}
</script>

</body>
</html>
