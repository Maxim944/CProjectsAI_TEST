<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ATIG</title>
<style>
  body {
    margin: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    background-color: #0c0d34; /* Almost black, deep space */
    overflow: hidden;
    position: relative;
    animation: bg-animation 5s linear infinite;
    font-family: 'Arial', sans-serif;
  }

  @keyframes bg-animation {
    to { background-position: -100% 0; }
  }

  .container {
    text-align: center;
    position: relative;
    z-index: 2;
  }

  .ATIG {
    font-size: 4em;
    color: #b3c4ff; /* Soft cold light */
    text-shadow: 0 2px 4px rgba(179, 196, 255, 0.5); /* Soft glow effect */
  }

  .subtitle {
    margin-top: 20px;
    color: #fff;
    font-size: 1.2em;
  }

  .button {
    margin-top: 30px;
    padding: 15px 30px;
    background-color: #ffffff; /* White for contrast */
    border: none;
    border-radius: 5px;
    color: #b3c4ff; /* Soft cold light */
    cursor: pointer;
    outline: none;
    transition: background-color 0.3s ease, box-shadow 0.3s ease;
    box-shadow: 0 2px 8px rgba(179, 196, 255, 0.3); /* Soft glow effect */
    border-radius: 10px;
    padding: 20px 40px;
  }

  .button:hover {
    background-color: #f8f9fa; /* Light grey on hover */
    box-shadow: 0 4px 6px rgba(179, 196, 255, 0.2); /* Soft glow effect */
  }

  .glow {
    position: absolute;
    top: -50%;
    left: -50%;
    width: 200%;
    height: 200%;
    background-image: radial-gradient(circle, rgba(179, 196, 255, 0.3) 10%, transparent 20%);
    animation: glow-animation 4s infinite;
    z-index: 1;
  }

  @keyframes glow-animation {
    to { background-position: 0 -50%; }
  }

  .particules {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 0;
  }

  .particule {
    width: 2px;
    height: 2px;
    background-color: #b3c4ff; /* Soft cold light */
    animation: particule-animation 5s linear infinite;
  }

  @keyframes particule-animation {
    to { transform: translate(100%, 100%); }
  }
</style>
</head>
<body>

<div class="glow"></div>
<div class="particules">
  <div class="particule" style="top: 20%; left: 40%; animation-delay: -2s;"></div>
  <div class="particule" style="top: 60%; left: 80%; animation-delay: -1s;"></div>
  <div class="particule" style="top: 10%; left: 90%;"></div>
</div>

<div class="container">
  <div class="ATIG">ATIG</div>
  <div class="subtitle">Персональный искусственный интеллект</div>
  <button class="button">Начать</button>
</div>

<script>
  async function sendMessageToATIG(text) {
    const response = await fetch('http://127.0.0.1:8000/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ user_id: 'user', message: text })
    });
    const data = await response.json();
    console.log("Ответ ATIG:", data.reply);
    return data.reply;
  }
</script>
</body>
</html>
